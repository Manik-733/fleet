name: "🧪 Testing & QA"
settings:
  features:
    enable_host_users: true
    enable_software_inventory: true
  host_expiry_settings:
    host_expiry_enabled: true
    host_expiry_window: 30
  secrets:
    - secret: $DOGFOOD_TESTING_AND_QA_ENROLL_SECRET
agent_options:
  config:
    options:
      pack_delimiter: /
      logger_tls_period: 10
      distributed_plugin: tls
      disable_distributed: false
      logger_tls_endpoint: /api/osquery/log
      distributed_interval: 10
      distributed_tls_max_attempts: 3
    decorators:
      load:
        - SELECT uuid AS host_uuid FROM system_info;
        - SELECT hostname AS hostname FROM system_info;
    # macOS FIM scope
    file_paths:
      system_binaries:
        - /usr/bin/%%
        - /usr/sbin/%%
        - /bin/%%
        - /sbin/%%
      launch_items:
        - /Library/LaunchAgents/%%
        - /Library/LaunchDaemons/%%
        - /Users/%/Library/LaunchAgents/%%
      etc:
        - /etc/%%
        - /private/etc/%%
    exclude_paths:
      etc:
        - /private/etc/cups/%%
        - /private/etc/newsyslog.d/%%
  command_line_flags:
    # Primary switch for the eventing system
    disable_events: false
    # Buffer / retention
    events_max: 50000
    events_expiry: 86400
    events_optimize: true
    # Watchdog headroom so evented workloads don't get killed
    watchdog_memory_limit: 350
    watchdog_utilization_limit: 130
    # --- macOS FIM ---
    enable_file_events: true
    # --- macOS EndpointSecurity tables (requires Full Disk Access for osqueryd) ---
    disable_endpointsecurity: false       # enables es_process_events
    disable_endpointsecurity_fim: false   # enables es_process_file_events
    # --- Linux process + socket auditing via the audit framework ---
    disable_audit: false
    audit_allow_process_events: true
    audit_allow_sockets: true
    audit_persist: true
    # --- Windows process auditing via ETW ---
    enable_process_etw_events: true
  update_channels:
    osqueryd: edge
    orbit: edge
    desktop: edge
controls:
  apple_settings:
    configuration_profiles:
      # Required for osqueryd to inherit Full Disk Access (EndpointSecurity tables)
      - path: ../lib/macos/configuration-profiles/full-disk-access-for-fleetd.mobileconfig
  setup_experience:
    macos_bootstrap_package: ""
    enable_end_user_authentication: true
    apple_setup_assistant:
  macos_updates:
    deadline:
    minimum_version:
  enable_disk_encryption: true
  scripts:
    # macOS scripts
    - path: ../lib/macos/scripts/uninstall-fleetd-macos.sh
    - path: ../lib/macos/scripts/remove-emudhra-roots-macos-system.sh
    - path: ../lib/macos/scripts/remediate-php2shell-macos.sh
    - path: ../lib/macos/scripts/disable-tailscale-ssh-forwarding-macos.sh
    # Windows scripts
    - path: ../lib/windows/scripts/remove-emudhra-roots-fleetd.ps1
    - path: ../lib/windows/scripts/mitigate-php2shell-windows.ps1
    # Linux scripts
    - path: ../lib/linux/scripts/uninstall-fleetd-linux.sh
    - path: ../lib/linux/scripts/install-fleet-desktop-required-extension.sh
    - path: ../lib/linux/scripts/remediate-php2shell-linux.sh
    - path: ../lib/linux/scripts/disable-tailscale-ssh-forwarding-linux.sh
    # macOS and Linux scripts
    - path: ../lib/all/scripts/remove-emudhra-roots-fleetd.sh
policies:
  # macOS policies
  - path: ../lib/macos/policies/cli-trust-store-excludes-emudhra-roots.yml
  # Linux policies
  - path: ../lib/linux/policies/check-fleet-desktop-extension-enabled.yml
reports:
  - path: ../lib/all/reports/dex-queries.yml
  - path: ../lib/windows/reports/collect-windows-11-hardware-readiness.yml
software:
